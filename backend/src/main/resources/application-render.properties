spring.application.name=indra-vaibhav-marble

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Old and new versions run side by side for about a minute during a deploy,
# so keep both pools well under the database's connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.data-reset.enabled=${DATA_RESET_ENABLED:false}
app.cors.allowed-origins=${FRONTEND_URL}

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.indravaibhavmarble=INFO
