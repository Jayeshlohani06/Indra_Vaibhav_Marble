spring.application.name=indra-vaibhav-marble
spring.config.import=classpath:application-local-secrets.properties

# Server
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/indra_vaibhav_marble
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
logging.level.org.springframework.security=DEBUG
logging.level.com.indravaibhavmarble.auth.security=DEBUG
# Local development configuration
app.jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}