spring.application.name=indra-vaibhav-marble
spring.config.import=optional:classpath:application-local-secrets.properties

server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5432/indra_vaibhav_marble
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.data-reset.enabled=${DATA_RESET_ENABLED:true}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.indravaibhavmarble.auth.security=INFO
