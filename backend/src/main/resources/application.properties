spring.application.name=indra-vaibhav-marble
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Compress larger JSON responses.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
# Finish requests already in progress before stopping, so a deploy never cuts
# off a save. Kept under the host's 30-second shutdown window.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
